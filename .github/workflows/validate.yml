name: Validate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      patches: ${{ steps.filter.outputs.patches }}
      dockerfiles: ${{ steps.filter.outputs.dockerfiles }}
      image: ${{ steps.filter.outputs.image }}
      deps: ${{ steps.filter.outputs.deps }}
      shell: ${{ steps.filter.outputs.shell }}
      markdown: ${{ steps.filter.outputs.markdown }}
      format: ${{ steps.filter.outputs.format }}
      workflows: ${{ steps.filter.outputs.workflows }}
      upstream: ${{ steps.filter.outputs.upstream }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            python: &python
              - '.github/workflows/validate.yml'
              - 'healthcheck.py'
              - 'scripts/**/*.py'
              - 'tests/**'
              - 'ruff.toml'
              - 'mypy.ini'
              - 'requirements-lint.txt'
              - 'requirements-test.txt'
            patches: &patches
              - '.github/workflows/validate.yml'
              - 'patches/**'
            dockerfiles: &dockerfiles
              - '.github/workflows/validate.yml'
              - 'Dockerfile'
              - 'Dockerfile.systemd'
            image:
              - *dockerfiles
              - *patches
              - '.dockerignore'
              - 'healthcheck.py'
            deps:
              - '.github/workflows/validate.yml'
              - 'requirements-lint.txt'
              - 'requirements-test.txt'
            shell:
              - '.github/workflows/validate.yml'
              - 'scripts/**/*.sh'
            markdown:
              - '.github/workflows/validate.yml'
              - '**/*.md'
            workflows:
              - '.github/workflows/**'
            format:
              - '.github/workflows/validate.yml'
              - '.prettierrc'
              - '.prettierignore'
              - '**/*.json'
              - '**/*.md'
              - '**/*.yml'
              - '**/*.yaml'
            upstream:
              - '.github/workflows/validate.yml'
              - 'patches/upstream.sha256'
              - 'scripts/check-upstream.py'

  hadolint:
    name: Dockerfile lint (hadolint)
    needs: changes
    if: ${{ needs.changes.outputs.dockerfiles == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        dockerfile: [Dockerfile, Dockerfile.systemd]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  python:
    name: Python (ruff, mypy, pytest)
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.patches == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install dependencies
        run: pip install -r requirements-lint.txt -r requirements-test.txt

      - name: Lint
        run: ruff check scripts/ tests/ healthcheck.py

      - name: Lint patches
        run: ruff check patches/

      - name: Format check
        run: ruff format --check scripts/ tests/ healthcheck.py

      - name: Type check
        run: mypy scripts/ healthcheck.py

      - name: Run tests
        run: pytest tests/ -v

  smoke-build:
    name: Image build and scan
    needs: changes
    if: ${{ needs.changes.outputs.image == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            tag: argonone:test
          - dockerfile: Dockerfile.systemd
            tag: argonone:test-systemd
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          format: json
          output: trivy-${{ matrix.dockerfile }}.json
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Report vulnerabilities
        shell: bash
        env:
          REPORT: trivy-${{ matrix.dockerfile }}.json
          VARIANT: ${{ matrix.dockerfile }}
        run: |
          set -uo pipefail
          count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$REPORT")
          if [[ "$count" -eq 0 ]]; then
            echo "No fixable CRITICAL or HIGH vulnerabilities in $VARIANT."
            exit 0
          fi
          echo "::warning title=trivy::$count fixable CRITICAL/HIGH vulnerabilities in $VARIANT - see the job summary. Not blocking this pull request."
          {
            echo "### Trivy findings for $VARIANT"
            echo
            echo "Remediation is a base image digest bump, which Renovate raises separately."
            echo
            echo '```text'
            jq -r '
              .Results[]?.Vulnerabilities[]?
              | "\(.Severity) \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion // "no fix")"
            ' "$REPORT" | sort -u
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  shell:
    name: Shell (shfmt + shellcheck)
    needs: changes
    if: ${{ needs.changes.outputs.shell == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shfmt and shellcheck
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: shfmt,shellcheck

      - name: Format check shell scripts
        run: shfmt --diff scripts/

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

  actionlint:
    name: Workflow lint (actionlint)
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          version: 1.7.12
          shellcheck: true

  prettier:
    name: Formatting (Prettier)
    needs: changes
    if: ${{ needs.changes.outputs.format == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Format check
        run: npx --yes prettier@3.9.6 --check .

  markdownlint:
    name: Markdown lint
    needs: changes
    if: ${{ needs.changes.outputs.markdown == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !CHANGELOG.md

  pip-audit:
    name: Dependency audit (pip-audit)
    needs: changes
    if: ${{ needs.changes.outputs.deps == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Pip audit
        shell: bash
        run: |
          set -uo pipefail
          requirements=(--requirement requirements-lint.txt --requirement requirements-test.txt)
          if pip-audit "${requirements[@]}" --desc 2>&1 | tee audit.log; then
            exit 0
          fi
          echo "::warning title=pip-audit::Advisories found - see the job summary. Not blocking this pull request."
          {
            echo "### pip-audit findings"
            echo
            echo '```text'
            cat audit.log
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  upstream-drift:
    name: Upstream drift check
    needs: changes
    if: ${{ needs.changes.outputs.upstream == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check upstream file hashes
        run: python3 scripts/check-upstream.py
