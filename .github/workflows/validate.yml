name: Validate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      image: ${{ steps.filter.outputs.image }}
      patches: ${{ steps.filter.outputs.patches }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            python: &python
              - '.github/workflows/validate.yml'
              - 'healthcheck.py'
              - 'scripts/**/*.py'
              - 'tests/**'
              - 'ruff.toml'
              - 'mypy.ini'
              - 'pyproject.toml'
              - 'uv.lock'
            patches: &patches
              - '.github/workflows/validate.yml'
              - 'patches/**'
            dockerfiles: &dockerfiles
              - '.github/workflows/validate.yml'
              - 'Dockerfile'
              - 'Dockerfile.systemd'
            image:
              - *dockerfiles
              - *patches
              - '.dockerignore'
              - 'healthcheck.py'
            deps:
              - '.github/workflows/validate.yml'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'scripts/pip-audit-report.sh'
            shell:
              - '.github/workflows/validate.yml'
              - 'scripts/**/*.sh'
            markdown:
              - '.github/workflows/validate.yml'
              - '**/*.md'
            workflows:
              - '.github/workflows/**'
            format:
              - '.github/workflows/validate.yml'
              - '.prettierrc'
              - '.prettierignore'
              - '**/*.json'
              - '**/*.md'
              - '**/*.yml'
              - '**/*.yaml'
            upstream:
              - '.github/workflows/validate.yml'
              - 'patches/upstream.sha256'
              - 'scripts/check-upstream.py'

      - name: Set up uv
        if: ${{ steps.filter.outputs.deps == 'true' }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.13.1
          python-version: '3.12'

      - name: Install pip-audit
        id: install
        if: ${{ steps.filter.outputs.deps == 'true' }}
        run: uv tool install pip-audit==2.10.1

      - name: Lint Dockerfile
        if: ${{ !cancelled() && steps.filter.outputs.dockerfiles == 'true' }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Lint Dockerfile.systemd
        if: ${{ !cancelled() && steps.filter.outputs.dockerfiles == 'true' }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile.systemd

      - name: Lint Python
        if: ${{ !cancelled() && steps.filter.outputs.python == 'true' }}
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: uv.lock
          args: check scripts/ tests/ healthcheck.py

      - name: Lint patches
        if: ${{ !cancelled() && steps.filter.outputs.patches == 'true' }}
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: uv.lock
          args: check patches/

      - name: Format check Python
        if: ${{ !cancelled() && steps.filter.outputs.python == 'true' }}
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: uv.lock
          args: format --check scripts/ tests/ healthcheck.py

      - name: Audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.filter.outputs.deps == 'true' }}
        shell: bash
        run: bash scripts/pip-audit-report.sh --disable-pip --requirement <(uv export --frozen --all-groups --no-emit-project --format requirements-txt) >>"$GITHUB_STEP_SUMMARY" || echo "::warning title=pip-audit::Advisories found or audit failed, see the job summary. Not blocking this pull request."

      - name: Check upstream file hashes
        if: ${{ !cancelled() && steps.filter.outputs.upstream == 'true' }}
        run: python3 scripts/check-upstream.py

      - name: Install shfmt and shellcheck
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: shfmt,shellcheck

      - name: Format check shell scripts
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        run: shfmt --diff scripts/

      - name: Lint shell scripts
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        run: shellcheck scripts/*.sh

      - name: Lint workflows
        if: ${{ !cancelled() && steps.filter.outputs.workflows == 'true' }}
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          version: 1.7.12
          shellcheck: true

      - name: Format check
        if: ${{ !cancelled() && steps.filter.outputs.format == 'true' }}
        run: npx --yes prettier@3.9.10 --check .

      - name: Lint Markdown
        if: ${{ !cancelled() && steps.filter.outputs.markdown == 'true' }}
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !CHANGELOG.md

  tests:
    name: Tests
    needs: checks
    if: ${{ !cancelled() && (needs.checks.outputs.python == 'true' || needs.checks.outputs.patches == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.13.1
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Type check
        run: uv run --locked mypy scripts/ healthcheck.py

      - name: Run tests
        run: uv run --locked pytest tests/ -v

  image:
    name: Image ${{ matrix.dockerfile }}
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.image == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            tag: argonone:test
          - dockerfile: Dockerfile.systemd
            tag: argonone:test-systemd
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          format: json
          output: trivy-${{ matrix.dockerfile }}.json
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Report vulnerabilities
        shell: bash
        env:
          REPORT: trivy-${{ matrix.dockerfile }}.json
          VARIANT: ${{ matrix.dockerfile }}
        run: |
          set -uo pipefail
          count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$REPORT")
          if [[ "$count" -eq 0 ]]; then
            echo "No fixable CRITICAL or HIGH vulnerabilities in $VARIANT."
            exit 0
          fi
          echo "::warning title=trivy::$count fixable CRITICAL/HIGH vulnerabilities in $VARIANT, see the job summary. Not blocking this pull request."
          {
            echo "### Trivy findings for $VARIANT"
            echo
            echo "Remediation is a base image digest bump, which Renovate raises separately."
            echo
            echo '```text'
            jq -r '
              .Results[]?.Vulnerabilities[]?
              | "\(.Severity) \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion // "no fix")"
            ' "$REPORT" | sort -u
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
