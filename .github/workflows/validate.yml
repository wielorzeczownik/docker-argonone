name: Validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Lint scripts
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: check
          src: scripts/

      - name: Lint patches
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: check
          src: patches/

      - name: Lint healthcheck
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: check
          src: healthcheck.py

      - name: Format check scripts
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: format --check
          src: scripts/

      - name: Format check healthcheck
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: format --check
          src: healthcheck.py

  smoke-build:
    name: Smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Build Docker image
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          push: false
          load: true
          tags: argonone:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: argonone:test
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up shfmt
        uses: mfinelli/setup-shfmt@v4.0.1

      - name: Format check shell scripts
        run: shfmt --diff scripts/

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v23.0.0
        with:
          globs: "**/*.md"

  upstream-drift:
    name: Upstream drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Check upstream file hashes
        run: python3 scripts/check-upstream.py
