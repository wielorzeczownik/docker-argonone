name: Validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        dockerfile: [Dockerfile, Dockerfile.systemd]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Lint scripts
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: check
          src: scripts/

      - name: Lint patches
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: check
          src: patches/

      - name: Lint tests
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: check
          src: tests/

      - name: Lint healthcheck
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: check
          src: healthcheck.py

      - name: Format check scripts
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: format --check
          src: scripts/

      - name: Format check healthcheck
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: format --check
          src: healthcheck.py

  smoke-build:
    name: Smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            tag: argonone:test
          - dockerfile: Dockerfile.systemd
            tag: argonone:test-systemd
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up shfmt
        uses: mfinelli/setup-shfmt@v4.0.1

      - name: Format check shell scripts
        run: shfmt --diff scripts/

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v23.2.0
        with:
          globs: |
            **/*.md
            !CHANGELOG.md

  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: pip install -r requirements-lint.txt

      - name: Type check
        run: mypy scripts/ healthcheck.py

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: pytest tests/ -v

  upstream-drift:
    name: Upstream drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Check upstream file hashes
        run: python3 scripts/check-upstream.py
