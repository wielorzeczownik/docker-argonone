name: Bug report
description: Something is not working correctly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Any detail helps, but don't worry if you don't know all of it. If you have a moment, a quick look through [open issues](https://github.com/wielorzeczownik/docker-argonone/issues) helps avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?

  - type: input
    id: hardware
    attributes:
      label: Hardware
      placeholder: 'e.g. Raspberry Pi 4, Argon ONE M.2'

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: 'e.g. Ubuntu 24.04, Debian Bookworm'

  - type: input
    id: docker_version
    attributes:
      label: Docker version
      placeholder: 'e.g. 27.0.0'

  - type: input
    id: image_version
    attributes:
      label: Image version
      placeholder: 'e.g. latest, v1.2.0'

  - type: dropdown
    id: variant
    attributes:
      label: Image variant
      description: Standard runs the daemon directly; systemd runs with `--privileged` for power-button support.
      options:
        - Standard (latest / <version>)
        - systemd (systemd / <version>-systemd)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Container logs
      description: Output of `docker logs argonone`
      render: text
