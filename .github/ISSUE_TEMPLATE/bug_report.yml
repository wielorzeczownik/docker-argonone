name: Bug report
description: Something is not working correctly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before reporting, check if the issue already exists in [open issues](https://github.com/wielorzeczownik/docker-argonone/issues).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware
      placeholder: "e.g. Raspberry Pi 4, Argon ONE M.2"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Ubuntu 24.04, Debian Bookworm"
    validations:
      required: true

  - type: input
    id: docker_version
    attributes:
      label: Docker version
      placeholder: "e.g. 27.0.0"
    validations:
      required: true

  - type: input
    id: image_version
    attributes:
      label: Image version
      placeholder: "e.g. latest, v1.2.0"

  - type: textarea
    id: logs
    attributes:
      label: Container logs
      description: Output of `docker logs argonone`
      render: text
